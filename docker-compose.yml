# SM121 System — Full AI Agent Stack
# Services: LiteLLM (LLM Proxy) + CLI-Anything (CLI Manager) + Hermes-Agent (AI Agent Hub)

services:
  # ====================
  # LiteLLM — LLM Proxy Server (self-built for ARM64)
  # ====================
  litellm:
    image: litellm-sm121:latest
    container_name: litellm-sm121
    ports:
      - "4000:4000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
      - REDIS_HOST=hermes-redis
      - REDIS_PORT=6379
    volumes:
      - litellm-data:/app
      - /home/murray/litellm/config.yaml:/app/config.yaml:ro
    command: ["litellm", "--config", "/app/config.yaml", "--port", "4000", "--host", "0.0.0.0"]
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:4000/')\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ====================
  # CLI-Anything — CLI Package Manager
  # ====================
  cli-anything:
    image: cli-anything-sm121:latest
    container_name: cli-anything-sm121
    volumes:
      - cli-anything-data:/app
    environment:
      - PYTHONPATH=/app
    restart: unless-stopped
    stdin_open: true
    tty: true

  # ====================
  # Hermes-Agent — AI Agent Hub
  # ====================
  hermes-agent:
    build: .
    image: hermes-agent-hermes-agent:latest
    container_name: hermes-agent-sm121
    ports:
      - "3001:9119"  # Web dashboard
      - "8001:8642"  # API gateway (api_server platform, default port 8642)
    environment:
      - HERMES_HOME=/opt/data
      - HERMES_WEB_DIST=/opt/hermes/hermes_cli/web_dist
      - PYTHONUNBUFFERED=1
      - HERMES_DASHBOARD=1
      - HERMES_DASHBOARD_HOST=0.0.0.0
      - HERMES_DASHBOARD_PORT=9119
      # Upstream v0.18.x removed HERMES_DASHBOARD_INSECURE: any non-loopback
      # dashboard bind now fail-closes without an auth provider. Basic auth
      # credentials live in the gitignored .env.
      - HERMES_DASHBOARD_BASIC_AUTH_USERNAME=${HERMES_DASHBOARD_BASIC_AUTH_USERNAME:?set in .env}
      - HERMES_DASHBOARD_BASIC_AUTH_PASSWORD=${HERMES_DASHBOARD_BASIC_AUTH_PASSWORD:?set in .env}
      # pre_llm_call intention router calls LiteLLM, which enforces the master
      # key since 2026-07-12. Without this the hook silently falls back to
      # keyword matching (see hermes-hooks/intention_router.py).
      - INTENTION_ROUTER_API_KEY=${LITELLM_MASTER_KEY:?set in .env}
      # Both defaults in intention_router.py name things that only resolve on
      # node1's compose network. LiteLLM stayed there; channel_gw is a host
      # service on the docker bridge, not localhost-inside-this-container.
      - INTENTION_ROUTER_BASE_URL=http://192.168.101.7:4000/v1
      - CHANNEL_GW_URL=http://172.22.0.1:5000
      # API Keys
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      # LINE platform plugin (小助理 OA) — since 2026-08-01 this is the
      # production LINE path; nginx routes /webhook/line here and channel_gw
      # no longer serves LINE. Port 8646 is deliberately NOT published to the
      # host: nginx reaches it over the docker bridge as hermes-agent-sm121:8646.
      - LINE_CHANNEL_ACCESS_TOKEN=${LINE_CHANNEL_ACCESS_TOKEN:-}
      - LINE_CHANNEL_SECRET=${LINE_CHANNEL_SECRET:-}
      - LINE_PORT=8646
      - LINE_PUBLIC_URL=https://ai.murray.tw
      # The gateway has its own authorization layer (_is_user_authorized) that
      # default-denies, and it runs BEFORE the plugin's gates. Authorization
      # for LINE is deliberately delegated to the plugin instead: DMs are gated
      # by the identity binding gate below, groups by @mention. Without this
      # flag the gateway rejects every sender ("Unauthorized user ... on line")
      # and the bot answers nobody — caught in production smoke test 2026-08-01.
      - LINE_ALLOW_ALL_USERS=true
      # Identity binding gate reads admin.db read-only and writes new bindings
      # through the Admin Panel API. Without ADMIN_DB_PATH every user is
      # treated as unbound and the bot answers nobody (logged at WARNING).
      - ADMIN_DB_PATH=/home/murray/ai-data/admin-panel/admin.db
      # localhost inside the container is the container itself, so the Admin
      # Panel has to be addressed over the docker bridge gateway.
      - ADMIN_PANEL_URL=http://172.22.0.1:8888
      # Group/room events are always forwarded to line_ingestion (F1-F6
      # summary + event extraction), independently of whether the agent replies.
      - LINE_INGESTION_FORWARD_URL=${LINE_INGESTION_FORWARD_URL:-}
      - LINE_INGESTION_INTERNAL_SECRET=${LINE_INGESTION_INTERNAL_SECRET:-}
      # Fallback for @mention detection when the LINE bot-info API call fails.
      - LINE_BOT_USER_ID=${LINE_BOT_USER_ID:-}
      # Murray, 2026-08-01: the bot answers in every group it is in, so new
      # groups need no config change. The @mention requirement is NOT relaxed
      # by this flag — it is the only thing keeping the bot from replying to
      # every group message.
      - LINE_GROUP_QA_ALLOW_ALL=true
    volumes:
      # Persist Hermes data (sessions, logs, skills, configs)
      - hermes-data:/opt/data
      # Mount Enterprise Skills into Hermes
      - /home/murray/enterprise-skills:/opt/data/skills/enterprise:ro
      # Identity map for LINE user -> employee resolution (read-only).
      - /home/murray/ai-data/admin-panel/admin.db:/home/murray/ai-data/admin-panel/admin.db:ro
      # Docker socket for sandbox environments
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: ["gateway", "run", "--accept-hooks"]
    restart: unless-stopped

  # ====================
  # Redis — Cache for LiteLLM
  # ====================
  redis:
    image: redis:8.6.4
    container_name: hermes-redis
    command: redis-server --port 6379
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6379", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ====================
  # Nginx — Reverse Proxy (optional)
  # ====================
  nginx:
    image: nginx:alpine
    container_name: hermes-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
    depends_on:
      - hermes-agent
      - litellm
    restart: unless-stopped

volumes:
  litellm-data:
  cli-anything-data:
  hermes-data:
  redis-data:

# The default bridge for this project is pinned so it lands on 172.22.0.1 on any
# host. Several services outside this compose reach back through that address —
# nginx upstreams, line-ingestion's bind address, group-secretary's outbox URL —
# and Docker otherwise hands out whichever /16 happens to be free, which differs
# between node1 and svc1.
networks:
  default:
    ipam:
      config:
        - subnet: 172.22.0.0/16
