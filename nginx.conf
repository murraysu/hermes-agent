events {
    worker_connections 1024;
}

http {
    client_max_body_size 50m;

    # --- Upstreams ---
    upstream hermes_agent {
        server hermes-agent-sm121:9119;
    }
    upstream hermes_api {
        server hermes-agent-sm121:8642;
    }
    upstream litellm {
        # LiteLLM stays on node1 — it is the only host with the USB4/QSFP route
        # to node2/node3, so it cannot follow the business layer to svc1. The
        # old value was a container name that only resolved inside node1's
        # compose network.
        server 192.168.101.7:4000;
    }
    upstream user_portal {
        server 172.22.0.1:8090;
    }
    upstream admin_panel {
        server 172.22.0.1:8888;
    }
    upstream channel_gw {
        server 172.22.0.1:5000;
    }
    upstream cli_hub {
        server 172.22.0.1:8080;
    }
    upstream paperclip {
        server 172.22.0.1:3100;
    }
    upstream group_secretary {
        server 172.22.0.1:8094;
    }
    upstream memory_hub {
        # Moved to svc1 on 2026-07-20 to follow the agent CLIs, its only
        # consumers; nginx moved to svc1 too on 2026-07-25, so it is back on
        # the local docker bridge.
        server 172.22.0.1:8091;
    }
    upstream ntfy {
        server ntfy:80;
    }
    upstream line_ingestion {
        server 172.22.0.1:8092;
    }

    # ai.murray.tw — Cloudflare Flexible SSL sends HTTP; do NOT redirect
    server {
        listen 80;
        server_name ai.murray.tw;

        location /webhook/line {
            proxy_pass http://channel_gw/webhook/line;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # /webhook/line-ingestion 已退役（2026-07-04）：小助理 OA webhook URL
        # 已改指 /webhook/line；歷史脈絡見 ai-harness ADR-0006/0008。

        # channel_gw 檔案託管（PDF 報告、語音回覆 m4a）。OA split 時漏了這條，
        # 2026-07-17 A線語音上線時補回。
        location /files/ {
            proxy_pass http://channel_gw/files/;
            proxy_set_header Host $host;
        }

        location / { return 404; }
    }

    # HTTP → HTTPS redirect
    server {
        listen 80 default_server;
        server_name _;
        location /.well-known/acme-challenge/ { root /var/www/certbot; }
        location / { return 301 https://$host$request_uri; }
    }

    server {
        listen 443 ssl;
        server_name _;
        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # --- Web UIs ---

        # Admin Panel (:8888)
        location /admin/ {
            proxy_pass http://admin_panel/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Hermes Dashboard (:9119 inside container)
        location /hermes/ {
            proxy_pass http://hermes_agent/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # CLI-Hub Web (:8080) — static files served under /hub/
        location /cli-hub/ {
            proxy_pass http://cli_hub/hub/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # --- APIs ---

        # Channel Gateway 檔案託管（PDF 報告、語音回覆 m4a；2026-07-17 補）
        location /files/ {
            proxy_pass http://channel_gw/files/;
            proxy_set_header Host $host;
        }

        # Channel Gateway LINE webhook (:5000 on host)
        location /webhook/line {
            proxy_pass http://channel_gw/webhook/line;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Hermes API (:8642 inside container) — SSE-tuned for mobile clients:
        # streaming chat must not be buffered, and long agent runs need more
        # than the 60s default read timeout.
        location /api/hermes/ {
            rewrite ^/api/hermes/(.*) /$1 break;
            proxy_pass http://hermes_api;
            proxy_http_version 1.1;
            proxy_set_header Connection '';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            gzip off;
        }

        # 群組秘書 approval fallback 頁（:8094，ADR-0009）
        location /api/group-secretary/ {
            rewrite ^/api/group-secretary/(.*) /$1 break;
            proxy_pass http://group_secretary;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Channel Gateway (:5000)
        location /api/gw/ {
            rewrite ^/api/gw/(.*) /$1 break;
            proxy_pass http://channel_gw;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # LiteLLM API (:4000)
        location /api/litellm/ {
            rewrite ^/api/litellm/(.*) /$1 break;
            proxy_pass http://litellm;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # SSE streaming endpoint — must come before /api/
        location /api/chat/stream {
            proxy_pass http://user_portal;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection '';
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            chunked_transfer_encoding on;
            gzip off;
        }

        # User Portal API — long timeout for AI inference
        location /api/ {
            proxy_pass http://user_portal;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }

        # --- User Web Portal (:8090) — 必須放最後 ---
        location / {
            proxy_pass http://user_portal;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Health check
        location /health {
            return 200 'OK';
            add_header Content-Type text/plain;
        }
    }


    # ntfy push notifications (container ntfy:80) — public via Cloudflare
    # Tunnel (ntfy.murray.tw). Auth is ntfy's own (deny-all + user/token).
    # ntfy needs WebSocket upgrade and read timeout > its 45s keepalive.
    server {
        listen 443 ssl;
        server_name ntfy.murray.tw;
        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        location / {
            proxy_pass http://ntfy;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 3m;
            proxy_send_timeout 3m;
            client_max_body_size 20m;
        }
    }

    # Memory Hub (:8091) — VPN/private access only.
    # The UI uses absolute paths such as /api/... and /sync, so keep it at /.
    server {
        listen 443 ssl;
        server_name memory.murray.tw 192.168.101.7;
        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow 169.254.0.0/16;
        allow 127.0.0.1;
        deny all;

        location / {
            proxy_pass http://memory_hub;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
